services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  django-web:
    build: .
    container_name: django-docker
    expose:
      - "8000"  # Expose port to Nginx, not to the host
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/static_root  # Share static files with Nginx
    command: ["sh", "-c", "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn ticket_system_project.wsgi:application --bind 0.0.0.0:8000"]

  nginx:
    image: nginx:latest
    ports:
      - "80:80"  # Expose port 80 to the host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static_root  # Access static files
    depends_on:
      - django-web

volumes:
  postgres_data:
  static_volume:  # Shared volume for static files