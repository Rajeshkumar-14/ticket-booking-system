{% extends 'administration/base.html' %}
{% block title %}SUPPORT-ADMIN{% endblock title %}

{% block support-admin %}
<div class="container-fluid">
    <div class="container-fluid">
        <div class="card text-light bg-blur border mt-2">
            <div class="card-header text-center text-uppercase border-bottom p-3">
                <h2>Support Page</h2>
            </div>
            <div class="card-body d-flex">
                <div class="users-list" style="width: 20%; padding: 0px;">
                    <h2 class="border-bottom pb-3">USERS</h2>
                    <ul class="list-unstyled small">
                        {% for user_info in all_messages %}
                        <li>
                            <button data-user-id="{{ user_info.user.id }}"
                                class="btn d-block w-100 text-start user-list-item text-capitalize p-3 user-list-btn shadow">
                                <div class="row align-items-center ">
                                    <div class="col-2">
                                        <i class="fa-solid fa-user text-light me-3 user-icon"></i>
                                    </div>
                                    <div class="col-10 p-3 px-2">
                                        <div class="row me-2">
                                            <p class="bg-dark text-light rounded-2 p-1 user-batch text-center">
                                                {{user_info.user.username }}</p>
                                            <hr class="bg-white p-0 m-0">
                                        </div>
                                        <div class="row mt-1">
                                            {% if user_info.last_message %}
                                            {% if user_info.last_message.sender == request.user %}
                                            <span class="text-light">You:
                                                {{ user_info.last_message.content}}</span>
                                            {% else %}
                                            <span class="text-light">Them:
                                                {{ user_info.last_message.content}}</span>
                                            {% endif %}
                                            <small class="text-light-emphasis support-time-stamp d-block ">
                                                {{ user_info.last_message.timestamp|date:"F j, Y H:i:s" }}
                                            </small>
                                            {% else %}
                                            <span class="text-light">No Messages Yet.</span>
                                            {% endif %}
                                        </div>
                                    </div>
                                </div>
                            </button>

                            <hr class="p-0 m-1 bg-white">
                        </li>
                        {% endfor %}
                    </ul>

                </div>
                <div class="vertical-line"></div>
                <div id="chat-box-container" style="width: 80%; padding: 10px;">

                    <div class="alert alert-info mt-3 shadow" id="select-chat-alert">
                        Please select a chat.
                    </div>

                    <div class="card bg-blur border mt-3" style="  display: none;">
                        <div class="card-header text-center text-uppercase border-bottom p-3">
                            <div class="container-fluid">
                                <div class="row">
                                    <div class="col-md-6 mt-2">
                                        <div class="d-flex align-items-start">
                                            <i class="fa-solid fa-user text-light me-3"></i>
                                            <h1 class="badge bg-primary" id="selected-user"></h1>
                                        </div>
                                    </div>
                                    <div class="col-md-6 text-end mt-2">
                                        <div class="d-flex justify-content-end align-items-center">
                                            <div class="online-indicator d-none">
                                                <span class="online-blink"></span>
                                            </div>
                                            <div class="offline-indicator d-none">
                                                <span class="offline-blink"></span>
                                            </div>
                                            <small id="user-status" class="text-light"></small>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                        <div class="card-body chat-box" style="height: 400px; overflow-y: auto;" id="chat-box">
                            <!-- Messages will be loaded here via Ajax -->
                        </div>

                        <div class="card-footer border-top p-3">
                            <form id="message-form">
                                {% csrf_token %}
                                <div class="form-group mb-2">
                                    <input type="hidden" name="receiver" value="" id="receiver">
                                    <textarea name="message" class="form-control" placeholder="Type your message"
                                        id="chat-content"></textarea>
                                </div>
                                <button type="button" class="btn btn-primary" id="send-message-btn">Send</button>
                                <button type="button" class="btn btn-danger float-end d-none"
                                    id="clear-conversation-btn" value="">Clear Conversation</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    div.online-indicator {
        display: inline-block;
        width: 15px;
        height: 15px;
        margin-right: 10px;

        background-color: #0fcc45;
        border-radius: 50%;

        position: relative;
    }

    span.online-blink {
        display: block;
        width: 15px;
        height: 15px;

        background-color: #0fcc45;
        opacity: 0.7;
        border-radius: 50%;

        animation: online-blink 1s linear infinite;
    }

    div.offline-indicator {
        display: inline-block;
        width: 15px;
        height: 15px;
        margin-right: 10px;

        background-color: #cc0f0f;
        border-radius: 50%;

        position: relative;
    }

    span.offline-blink {
        display: block;
        width: 15px;
        height: 15px;

        background-color: #cc0f0f;
        opacity: 0.7;
        border-radius: 50%;

        animation: offline-blink 1s linear infinite;
    }

    @keyframes online-blink {
        100% {
            transform: scale(2, 2);
            opacity: 0;
        }
    }

    @keyframes offline-blink {
        100% {
            transform: scale(2, 2);
            opacity: 0;
        }
    }
</style>


<!-- Include jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
    $(document).ready(function () {
        // Function to load messages via Ajax
        var userMessagesInterval;

        function loadUserMessages(userId) {
            $.ajax({
                url: `{% url 'load-user-messages' user_id=0 %}`.replace('0', userId),
                type: "GET",
                success: function (data) {
                    // Show the chat box container and hide the "Please select a chat" alert
                    $("#select-chat-alert").hide();
                    $("#chat-box-container .card").show();

                    // Set selected user and user status
                    $("#selected-user").text(data.selected_user);
                    $("#user-status").text(data.user_status);
                    $("#receiver").val(data.selected_user_id);
                    $("#clear-conversation-btn").val(data.selected_user_id);
                    var userStatus = data.user_status; // Replace this with the actual value

                    // Update the user status text
                    $("#user-status").text(userStatus);

                    // Show/hide online or offline indicator based on user status
                    if (userStatus === "Online") {
                        $(".online-indicator").removeClass("d-none");
                        $(".offline-indicator").addClass("d-none");
                    } else {
                        $(".online-indicator").addClass("d-none");
                        $(".offline-indicator").removeClass("d-none");
                    }

                    // Empty and load messages
                    $("#chat-box").empty();
                    data.messages.forEach(function (message) {
                        const isSender = message.sender === '{{ request.user.username }}';

                        $("#chat-box").append(
                            `<div class="d-flex mb-2 p-2 ${isSender ? 'justify-content-end' : 'justify-content-start'}">
                        ${isSender ? '' : '<i class="fa-solid text-light fa-user mt-2"></i>'}
                        <h6 class="bg-${isSender ? 'primary' : 'secondary'} text-light rounded p-2 ${isSender ? 'me-3' : 'ms-3'}">${message.content}</h6>
                        ${isSender ? '<i class="fa-solid fa-user text-light mt-2"></i>' : ''}
                    </div>`
                        );
                    });
                    if (data.messages.length > 0) {
                        $("#clear-conversation-btn").removeClass('d-none').addClass('d-visible');
                    } else {
                        $("#clear-conversation-btn").removeClass('d-visible').addClass('d-none');
                    }
                    $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                    $('#chat-content').val('');
                },
                error: function (error) {
                    Swal.fire("Error", "Error Loading Messages, Try again later.", "error");
                }
            });
        }

        function startUserMessagesInterval() {
            userMessagesInterval = setInterval(function () {
                const selectedUserId = $("#receiver").val();
                if (selectedUserId) {
                    loadUserMessages(selectedUserId);
                }
            }, 2000);
        }

        function stopUserMessagesInterval() {
            clearInterval(userMessagesInterval);
        }
        startUserMessagesInterval();

        // Set up event listeners to stop and start the interval when the chat content is focused or blurred
        $('#chat-content').focus(function () {
            stopUserMessagesInterval();
        });

        $('#chat-content').blur(function () {
            startUserMessagesInterval();
        });

        // Function to handle sending messages via Ajax
        $("#send-message-btn").click(function () {
            $.ajax({
                url: "{% url 'support-admin' %}",
                type: "POST",
                data: $("#message-form").serialize(),
                success: function (data) {
                    loadUserMessages(data.user_id);
                },
                error: function (error) {
                    Swal.fire("Error", "Error Sending Message, Please try after sometime.", "error");
                }
            });
        });

        $(".user-list-btn").click(function () {
            const userId = $(this).data("user-id");
            loadUserMessages(userId);
        });


        // Function to handle clear conversation
        $("#clear-conversation-btn").click(function () {
            var conversationId = $(this).val();

            Swal.fire({
                title: "Are you sure?",
                text: "You are about to clear this Conversation.",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Yes",
                cancelButtonText: "No",
            }).then(function (result) {
                if (result.isConfirmed) {
                    // User confirmed the action, send the AJAX request
                    $.ajax({
                        type: "POST",
                        url: "{% url 'clear-admin-conversation' %}",
                        data: {
                            csrfmiddlewaretoken: "{{ csrf_token }}",
                            user_id: conversationId
                        },
                        success: function (response) {
                            Swal.fire("Cleared!", "Conversation Cleared Successfully", "success").then(function () {
                                location.reload();
                            });
                        },
                        error: function (error) {
                            Swal.fire("Error", "Error While Clearing Conversation", "error");
                        }
                    });
                }
            });
        });

    });
</script>

{% endblock support-admin %}
